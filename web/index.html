<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stellar Neighborhood — a navigable atlas</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#04060d" />
    <!-- iOS Safari/Chrome (all WebKit — the Fullscreen API doesn't work for
         page content there at all) never hides its own chrome in a normal
         tab. This is the actual route to a chrome-free view on iPhone:
         apple-mobile-web-app-capable makes a home-screen-launched icon run
         standalone, no browser UI. No apple-touch-icon yet (needs a real
         PNG, not SVG) — iOS falls back to an auto-generated screenshot
         thumbnail until one exists. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stellar Neighborhood" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #04060d; }
      /* This app is a fixed single-viewport experience by design — nothing
         should ever scroll the page itself (only the canvas's own custom
         drag/pinch handlers move the camera). Without this, iOS standalone
         mode lets html/body rubber-band/bounce on a downward drag (there
         was no overflow/position lock on them at all), which both shifts
         the top-corner buttons out of place mid-bounce and swallows the
         touch as a scroll gesture instead of delivering it as a tap — the
         actual cause of "pull the screen down and they can't be clicked."
         overscroll-behavior is the modern (iOS 16+) way to say the same
         thing; position:fixed is the older, more universally effective one
         for WebKit specifically, so both are set as belt-and-suspenders. */
      html, body { overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; }
      /* 100vh doesn't track mobile Chrome's collapsing address bar, leaving
         the canvas taller than what's actually visible. 100dvh does — kept
         as a second declaration (not a replacement) so browsers that don't
         understand dvh silently keep the vh value instead of erroring. */
      .stars-root { height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
